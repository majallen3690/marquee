[project]
name = "marquee"
version = "0.1.0"
description = "Market-microstructure sandbox: a deterministic limit order book, matching engine, and multi-agent market simulation."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    # Exact pin: NEP 19 does not guarantee bit-stream stability for Generator
    # distribution methods across numpy releases — bumping this is a
    # determinism-breaking change requiring golden-log regeneration (ADR-006).
    "numpy==2.5.1",
    # Config parsing only — never determinism-sensitive: the config hash covers
    # raw file bytes, not any YAML re-serialization (ADR-006).
    "pyyaml>=6.0.2",
    # M5 bridge (outside the sim path — pacing/serving only, ADR-015).
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # Bare uvicorn ships no WebSocket implementation; without this the feed
    # silently degrades to "Unsupported upgrade request" and the UI shows
    # FEED LOST forever.
    "websockets>=13.0",
]

[project.scripts]
marquee-demo = "marquee.server.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "hypothesis>=6.115",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marquee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: multi-seed sweeps (minutes); run with `pytest -m slow`"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

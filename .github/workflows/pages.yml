name: Demo on GitHub Pages

# The zero-install demo: record the committed run, build the front end in
# static mode (it plays the recording in the browser, no server), publish.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python -m marquee.server.record --out viz/public/replay/m5-flash-crash.json
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: viz/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: viz
      - run: pnpm build
        working-directory: viz
        env:
          NEXT_PUBLIC_MARQUEE_STATIC: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: touch viz/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viz/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

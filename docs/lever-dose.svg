<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Barlow, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Lever study: dose-response</title>
<desc id="d">Median price move in the 5 seconds after the lever, over 30 seeds, against how far the market makers quote from the best price. Widening quotes alone raises the move steadily from 27 to 152 ticks; the full lever, which also cuts size and inventory limits, levels off near 65.</desc>
<rect width="760" height="430" fill="#171614"/>
<text x="64.0" y="32.0" font-size="17" fill="#edebe6" text-anchor="start" font-weight="600">Distance, not depth: how far makers step back sets the move</text>
<text x="64.0" y="54.0" font-size="12" fill="#b4afa6" text-anchor="start" font-weight="400">Median price move in the 5 s after the lever · 30 seeds · bars are 95% bootstrap intervals</text>

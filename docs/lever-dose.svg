<circle cx="73" cy="74" r="4" fill="#bf8630" stroke="#171614" stroke-width="2"/>
<text x="88.0" y="78.0" font-size="12" fill="#b4afa6" text-anchor="start" font-weight="400">widen quotes only</text>
<line x1="235" y1="74" x2="253" y2="74" stroke="#2e9d8b" stroke-width="2"/>

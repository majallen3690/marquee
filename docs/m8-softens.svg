<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Barlow, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">M8: a learned market maker under the lever</title>
<desc id="d">Size of the price move in the 5 seconds after the lever, over 30 seeds, for five versions of the second market-maker seat. Rule-based: 55 ticks with no lever, 187 when it takes the lever, 95 when it holds its quotes. Learned: 12.5 with no lever and 12.8 with the lever. The learned seat's move is smaller than the holding rule-based seat's on 29 of 30 seeds.</desc>
